[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "factor-rl"
version = "0.1.0"
description = "Credit-conserving action-to-token allocation for multi-turn agent reinforcement learning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "torch",
]

[tool.setuptools.packages.find]
include = ["factor*"]
